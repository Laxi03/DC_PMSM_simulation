name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build source and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Test installed baselines
        run: |
          python -m pip install dist/*.whl
          td3-control --help
          python -m unittest discover -s tests -v
      - name: Test TD3 environments and checkpoint round trip
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          wheel=$(find dist -name '*.whl' -print -quit)
          python -m pip install "${wheel}[rl]"
          python -m pip check
          python -m unittest discover -s tests -v
          td3-control train --motor dc --task current --run ci-smoke --steps 128 --workspace "$RUNNER_TEMP/td3"
          td3-control eval --motor dc --task current --checkpoint "$RUNNER_TEMP/td3/models/dc/current/ci-smoke/model.zip" --duration 0.1 --workspace "$RUNNER_TEMP/td3"
